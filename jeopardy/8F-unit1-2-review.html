:root{
  --board:#1F3A30;
  --board-deep:#152A22;
  --chalk:#EEF1EA;
  --chalk-dim:#A9B8B0;
  --chalk-yellow:#F5D76E;
  --chalk-pink:#F4A6B8;
  --chalk-blue:#9FD3F2;
  --correct:#A8E6A1;
  --wrong:#FF8F80;
  --line:rgba(238,241,234,.35);

  --fs-question:clamp(2.5rem,4.2vw,5rem);
  --fs-question-long:clamp(1.75rem,3vw,3.6rem);
  --fs-score:clamp(2rem,3.33vw,4rem);
  --fs-cell:clamp(1.75rem,2.9vw,3.5rem);
  --fs-heading:clamp(1.5rem,2.08vw,2.5rem);
  --fs-body:clamp(1.25rem,1.67vw,2rem);
  --fs-min:clamp(1.125rem,1.46vw,1.75rem);
  --fs-teacher:clamp(1rem,.94vw,1.25rem);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--board);color:var(--chalk);
  font-family:'Atkinson Hyperlegible Next',sans-serif;font-weight:400;
  font-size:var(--fs-body);line-height:1.4;overflow:hidden;
}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* Score strip */
#scores{display:grid;grid-template-columns:repeat(3,1fr);background:var(--board-deep);border-bottom:2px solid var(--line)}
.team{display:flex;align-items:baseline;justify-content:center;gap:.6em;padding:.4em .5em .3em;border-bottom:6px solid currentColor}
.team .name{font-size:var(--fs-heading);font-weight:800;color:var(--chalk)}
.team .pts{font-size:var(--fs-score);font-weight:800;line-height:1}
.t0{color:var(--chalk-yellow)}.t1{color:var(--chalk-pink)}.t2{color:var(--chalk-blue)}

main{position:relative;min-height:0;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0}
.screen.on{display:flex}

/* Board */
#board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto repeat(5,1fr);width:100%;border-left:2px solid var(--line)}
.cat,.cell{border-right:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0}
.cat{display:flex;align-items:center;justify-content:center;text-align:center;padding:.4em .3em;font-size:var(--fs-heading);font-weight:800;line-height:1.15;min-height:2.8em}
.cell{
  background:transparent;color:var(--chalk-yellow);font:inherit;font-size:var(--fs-cell);font-weight:800;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative;
}
.cell:hover:not(.used){background:rgba(238,241,234,.08)}
.cell .v{display:block;clip-path:inset(0 0 0 0)}
.cell.used{cursor:default;background-color:rgba(238,241,234,.06);
  background-image:repeating-linear-gradient(0deg,rgba(238,241,234,.07) 0 10px,transparent 10px 22px)}
.cell.used .v{clip-path:inset(0 0 0 100%)}
.cell.erasing .v{animation:erase .4s ease-in forwards}
@keyframes erase{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}

/* Question */
#qscreen{flex-direction:column}
.qhead{display:flex;justify-content:space-between;gap:1em;padding:.5em 1em;border-bottom:2px solid var(--line);font-size:var(--fs-heading);font-weight:800}
.qhead .dd{color:var(--chalk-yellow)}
.qbody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:.5em 1.2em;text-align:center;gap:.6em}
#qtext{font-size:var(--fs-question);font-weight:800;line-height:1.25;white-space:pre-line;max-width:28em}
#qtext.long{font-size:var(--fs-question-long);text-align:left}
#atext{font-size:var(--fs-question-long);font-weight:800;color:var(--wrong);min-height:1.3em}
#qnote{font-size:var(--fs-min);color:var(--chalk-dim)}

/* Setup / Daily Double / End */
.center{flex-direction:column;align-items:center;justify-content:center;gap:.7em;padding:1em;text-align:center}
h1{font-size:var(--fs-question);font-weight:800;line-height:1.1;margin:0}
h2{font-size:var(--fs-score);font-weight:800;line-height:1.1;margin:0}
.sub{font-size:var(--fs-heading);color:var(--chalk-dim);margin:0}
.names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1em;margin:.6em 0;width:min(100%,60em)}
.names label{display:flex;flex-direction:column;gap:.3em;font-size:var(--fs-min);font-weight:800}
.names input{font:inherit;font-size:var(--fs-body);background:transparent;color:var(--chalk);border:2px solid currentColor;border-radius:6px;padding:.4em .5em;min-height:64px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center}
.final{font-size:var(--fs-heading);display:grid;gap:.3em}
.final div{font-weight:800}
.hint{font-size:var(--fs-teacher);color:var(--chalk-dim)}

/* Buttons */
button{font-family:inherit}
.btn{
  font-size:var(--fs-body);font-weight:800;min-height:64px;padding:.3em 1em;cursor:pointer;
  background:transparent;color:var(--chalk);border:2px solid var(--chalk);border-radius:6px;line-height:1.2;
}
.btn:hover{background:rgba(238,241,234,.1)}
.btn.primary{background:var(--chalk-yellow);color:var(--board);border-color:var(--chalk-yellow)}
.btn.primary:hover{background:var(--chalk)}
.btn.g0{color:var(--chalk-yellow);border-color:var(--chalk-yellow)}
.btn.g1{color:var(--chalk-pink);border-color:var(--chalk-pink)}
.btn.g2{color:var(--chalk-blue);border-color:var(--chalk-blue)}
.btn.ok{color:var(--correct);border-color:var(--correct)}
.btn.no{color:var(--wrong);border-color:var(--wrong)}
.btn.small{font-size:var(--fs-teacher);min-height:48px}
:focus-visible{outline:3px solid var(--chalk-yellow);outline-offset:4px}

/* Chalk shelf */
#rack{display:flex;align-items:center;gap:.7em;flex-wrap:wrap;background:var(--board-deep);border-top:2px solid var(--line);padding:.5em 1em;min-height:84px}
#rack .title{font-size:var(--fs-min);color:var(--chalk-dim);margin-right:auto}
#rack .grow{margin-left:auto}

.flash-ok{animation:fok .3s ease-out}
.flash-no{animation:fno .3s ease-out}
@keyframes fok{from{background:var(--correct)}}
@keyframes fno{from{background:var(--wrong)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="scores" aria-live="polite"></header>

  <main>
    <!-- Setup -->
    <section id="setup" class="screen center on" aria-labelledby="setupTitle">
      <h1 id="setupTitle">Jeopardy</h1>
      <p class="sub">8/F · Unit 1 Friendship &amp; Unit 2 Teen Life review</p>
      <div class="names">
        <label class="t0">Group 1 name<input id="n0" value="Group 1" maxlength="16"></label>
        <label class="t1">Group 2 name<input id="n1" value="Group 2" maxlength="16"></label>
        <label class="t2">Group 3 name<input id="n2" value="Group 3" maxlength="16"></label>
      </div>
      <div class="row">
        <button class="btn primary" id="startBtn">Start game</button>
        <button class="btn" id="continueBtn" hidden>Continue saved game</button>
      </div>
      <p class="hint">Group names are optional. A keyboard is not needed to play.</p>
    </section>

    <!-- Board -->
    <section id="boardScreen" class="screen" aria-label="Game board">
      <div id="board" role="grid"></div>
    </section>

    <!-- Daily Double -->
    <section id="ddScreen" class="screen center" aria-labelledby="ddTitle">
      <h1 id="ddTitle">Daily Double</h1>
      <p class="sub" id="ddInfo"></p>
      <p class="sub">Which group answers?</p>
      <div class="row" id="ddGroups"></div>
    </section>

    <!-- Question -->
    <section id="qscreen" class="screen" aria-live="polite">
      <div class="qhead"><span id="qcat"></span><span id="qpts"></span></div>
      <div class="qbody">
        <div id="qtext"></div>
        <div id="atext"></div>
        <div id="qnote"></div>
        <div class="row" id="awards"></div>
      </div>
    </section>

    <!-- End -->
    <section id="endScreen" class="screen center" aria-live="polite">
      <h1 id="winner"></h1>
      <div class="final" id="finalScores"></div>
    </section>
  </main>

  <footer id="rack"></footer>
</div>

<script>
var TITLE = '8/F · Unit 1 & 2 review';
var VALUES = [100, 200, 300, 400, 500];
var CATS = [
  { name: 'Friendship words', qs: [
    { q: 'What is the Turkish meaning of "hang out"?', a: 'takılmak, vakit geçirmek' },
    { q: 'A good friend never tells your ___.', a: 'secrets' },
    { q: 'What is the Turkish meaning of "rely on"?', a: 'güvenmek, bel bağlamak' },
    { q: 'He is nice to you in front of you but says bad things behind your back. He is a ___.', a: 'backstabber' },
    { q: 'Batuhan always thinks about other people\'s feelings. He is ___.', a: 'considerate (düşünceli)' }
  ]},
  { name: 'Accept or refuse?', qs: [
    { q: '"Sure, why not?"\nAccept or refuse?', a: 'Accept' },
    { q: '"Sorry, I can\'t. I have a lot of homework."\nAccept or refuse?', a: 'Refuse' },
    { q: '"I\'d love to, but I have to visit my grandma."\nAccept or refuse?', a: 'Refuse' },
    { q: 'Aysima: "Would you like to come to my birthday party?"\nSay one way to ACCEPT.', a: 'I\'d love to! / Count me in! / That sounds great!' },
    { q: 'Which is the most polite refusal?\na) No way!\nb) I\'m afraid I can\'t. I\'ll be busy.\nc) I don\'t want to.', a: 'b) I\'m afraid I can\'t. I\'ll be busy.' }
  ]},
  { name: 'Teen life words', qs: [
    { q: 'What is the Turkish meaning of "free time"?', a: 'boş zaman' },
    { q: 'What is the Turkish meaning of "horse riding"?', a: 'ata binme' },
    { q: 'Talking with friends on the internet is ___.', a: 'chatting online' },
    { q: 'You throw a heavy ball and knock down pins. What is this sport?', a: 'bowling' },
    { q: 'What is the Turkish meaning of "be keen on"?', a: 'çok hevesli olmak, düşkün olmak' }
  ]},
  { name: 'Likes and dislikes', qs: [
    { q: '"I can\'t stand rap music."\nLike or dislike?', a: 'Dislike' },
    { q: 'Put these in order from LOVE to HATE:\nlike, adore, can\'t stand', a: 'adore → like → can\'t stand' },
    { q: 'Yaprak is fond of ___ (read) books.', a: 'reading' },
    { q: 'Efe prefers basketball ___ football.', a: 'to' },
    { q: 'Find the mistake:\n"Mustafamert is keen in playing chess."', a: 'keen ON playing chess' }
  ]},
  { name: 'LGS style', qs: [
    { q: 'Ebrar: "I\'m sorry I\'m late."\nWhat is she doing?\na) apologizing\nb) inviting\nc) refusing', a: 'a) apologizing' },
    { q: 'Berkay: "Why don\'t we go to the cinema?"\nWhat is he doing?\na) refusing\nb) making a suggestion\nc) apologizing', a: 'b) making a suggestion' },
    { q: 'Buse loves sports but hates staying at home. What will she do on Sunday?\na) watch TV\nb) cycle in the park\nc) sleep all day', a: 'b) cycle in the park' },
    { q: 'Tuba: "A true friend is always there for you in good and bad times."\nWhat is a true friend, according to Tuba?\na) supportive\nb) jealous\nc) selfish', a: 'a) supportive' },
    { q: 'Emir Kaan: "I prefer spending time alone to going out. I\'m into reading and puzzles."\nWhich is TRUE?\na) He is keen on outdoor activities.\nb) He likes being alone more than going out.\nc) He can\'t stand reading.', a: 'b) He likes being alone more than going out.' }
  ]}
];
var SAVE_KEY = 'jeopardy-8F-unit1-2';

var state = null;      // {names, scores, used:{}, dd:'c-r'}
var current = null;    // {c, r, dd, group}
var shown = [0, 0, 0]; // scores currently displayed (for counting)
var soundOn = true;

function $(id) { return document.getElementById(id); }

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ---------- Sound (Web Audio) ---------- */
var actx = null;
function tone(freq, start, dur, type, vol) {
  if (!soundOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var t = actx.currentTime + start;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
var sfx = {
  open: function () { tone(660, 0, 0.12, 'triangle'); },
  correct: function () { tone(523, 0, 0.15); tone(659, 0.12, 0.15); tone(784, 0.24, 0.3); },
  none: function () { tone(330, 0, 0.2, 'triangle'); tone(247, 0.18, 0.35, 'triangle'); },
  dd: function () { [392, 523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.1, 0.25, 'square', 0.12); }); },
  end: function () { [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { tone(f, i * 0.15, 0.3, 'triangle'); }); }
};

/* ---------- Speech (TTS) ---------- */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text.replace(/_{2,}/g, 'blank').replace(/\n/g, '. '));
  u.lang = 'en-US'; u.rate = 0.9;
  var v = speechSynthesis.getVoices().filter(function (x) { return /^en(-|_)/i.test(x.lang); });
  if (v.length) u.voice = v.filter(function (x) { return /en(-|_)US/i.test(x.lang); })[0] || v[0];
  speechSynthesis.speak(u);
}
function stopSpeech() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ---------- Rendering ---------- */
function show(id) {
  ['setup', 'boardScreen', 'ddScreen', 'qscreen', 'endScreen'].forEach(function (s) {
    $(s).classList.toggle('on', s === id);
  });
}

function rack(buttons) {
  var r = $('rack'); r.innerHTML = '';
  var t = document.createElement('span'); t.className = 'title'; t.textContent = TITLE; r.appendChild(t);
  buttons.forEach(function (b) {
    var el = document.createElement('button');
    el.className = 'btn ' + (b.cls || ''); el.textContent = b.text; el.onclick = b.fn;
    if (b.label) el.setAttribute('aria-label', b.label);
    r.appendChild(el);
  });
  var s = document.createElement('button');
  s.className = 'btn small'; s.textContent = soundOn ? 'Sound: on' : 'Sound: off';
  s.onclick = function () { soundOn = !soundOn; s.textContent = soundOn ? 'Sound: on' : 'Sound: off'; };
  r.appendChild(s);
}

function renderScores() {
  var h = $('scores'); h.innerHTML = '';
  for (var i = 0; i < 3; i++) {
    var d = document.createElement('div'); d.className = 'team t' + i; d.id = 'team' + i;
    d.innerHTML = '<span class="name"></span><span class="pts" id="pts' + i + '"></span>';
    d.querySelector('.name').textContent = state ? state.names[i] : 'Group ' + (i + 1);
    d.querySelector('.pts').textContent = shown[i];
    h.appendChild(d);
  }
}

function countTo(i, target) {
  var from = shown[i], start = null, el = $('pts' + i);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || from === target) { shown[i] = target; el.textContent = target; return; }
  function step(ts) {
    if (!start) start = ts;
    var p = Math.min(1, (ts - start) / 600);
    var val = Math.round(from + (target - from) * p);
    el.textContent = val;
    if (p < 1) requestAnimationFrame(step); else shown[i] = target;
  }
  requestAnimationFrame(step);
  var team = $('team' + i);
  team.classList.remove('flash-ok'); void team.offsetWidth; team.classList.add('flash-ok');
}

function renderBoard() {
  var b = $('board'); b.innerHTML = '';
  CATS.forEach(function (c) {
    var h = document.createElement('div'); h.className = 'cat'; h.setAttribute('role', 'columnheader');
    h.textContent = c.name; b.appendChild(h);
  });
  for (var r = 0; r < 5; r++) {
    for (var c = 0; c < 5; c++) {
      var key = c + '-' + r, used = !!state.used[key];
      var cell = document.createElement('button');
      cell.className = 'cell' + (used ? ' used' : '');
      cell.id = 'cell' + key;
      cell.setAttribute('aria-label', CATS[c].name + ', ' + VALUES[r] + (used ? ', done' : ''));
      cell.innerHTML = '<span class="v">' + VALUES[r] + '</span>';
      if (used) cell.disabled = true;
      cell.onclick = (function (c, r) { return function () { openCell(c, r); }; })(c, r);
      b.appendChild(cell);
    }
  }
}

function boardView() {
  stopSpeech(); current = null;
  renderBoard(); show('boardScreen');
  rack([
    { text: 'End game', fn: endGame },
    { text: 'New game', fn: newGame }
  ]);
}

/* ---------- Game flow ---------- */
function startGame() {
  var names = [0, 1, 2].map(function (i) { return ($('n' + i).value || '').trim() || ('Group ' + (i + 1)); });
  var c = Math.floor(Math.random() * 5), r = 1 + Math.floor(Math.random() * 4);
  state = { names: names, scores: [0, 0, 0], used: {}, dd: c + '-' + r };
  shown = [0, 0, 0];
  save(); renderScores(); boardView();
}

function continueGame() {
  state = load(); shown = state.scores.slice();
  renderScores(); boardView();
}

function newGame() {
  if (!confirm('Start a new game? All scores will be reset.')) return;
  stopSpeech(); clearSave(); state = null; shown = [0, 0, 0];
  renderScores(); show('setup'); setupRack();
  $('continueBtn').hidden = true;
}

function openCell(c, r) {
  if (state.used[c + '-' + r]) return;
  current = { c: c, r: r, dd: state.dd === c + '-' + r, group: null };
  if (current.dd) {
    sfx.dd();
    $('ddInfo').textContent = CATS[c].name + ' · ' + VALUES[r] + ' → correct answer wins ' + (VALUES[r] * 2);
    var g = $('ddGroups'); g.innerHTML = '';
    state.names.forEach(function (n, i) {
      var b = document.createElement('button'); b.className = 'btn g' + i; b.textContent = n;
      b.onclick = function () { current.group = i; showQuestion(); };
      g.appendChild(b);
    });
    show('ddScreen');
    rack([{ text: 'Back to board', fn: boardView }]);
  } else {
    sfx.open(); showQuestion();
  }
}

function showQuestion() {
  var c = current.c, r = current.r, item = CATS[c].qs[r];
  var pts = current.dd ? VALUES[r] * 2 : VALUES[r];
  $('qcat').textContent = CATS[c].name;
  $('qpts').innerHTML = current.dd
    ? '<span class="dd">Daily Double</span> · ' + pts + ' points'
    : pts + ' points';
  var qt = $('qtext'); qt.textContent = item.q;
  qt.classList.toggle('long', item.q.length > 70 || item.q.indexOf('\na)') > -1);
  $('atext').textContent = '';
  $('qnote').textContent = current.dd ? 'Only ' + state.names[current.group] + ' answers. A wrong answer loses no points.' : '';
  show('qscreen');

  var btns = [
    { text: 'Read aloud', fn: function () { speak(item.q); } },
    { text: 'Show answer', cls: 'primary', fn: function () { $('atext').textContent = item.a; } }
  ];
  var aw = [];
  if (current.dd) {
    var g = current.group;
    aw.push({ text: '✓ Correct +' + pts, cls: 'ok', fn: function () { award(g, pts); } });
    aw.push({ text: '✗ Wrong', cls: 'no', fn: function () { award(null, 0); } });
  } else {
    state.names.forEach(function (n, i) {
      aw.push({ text: n + ' +' + pts, cls: 'g' + i, label: 'Give ' + pts + ' points to ' + n, fn: function () { award(i, pts); } });
    });
    aw.push({ text: 'No one', fn: function () { award(null, 0); } });
  }
  var box = $('awards'); box.innerHTML = '';
  aw.forEach(function (b) {
    var el = document.createElement('button');
    el.className = 'btn ' + b.cls; el.textContent = b.text; el.onclick = b.fn;
    if (b.label) el.setAttribute('aria-label', b.label);
    box.appendChild(el);
  });
  btns.push({ text: 'Back to board', fn: boardView });
  rack(btns);
}

function award(group, pts) {
  var key = current.c + '-' + current.r;
  state.used[key] = true;
  if (group !== null) { state.scores[group] += pts; sfx.correct(); countTo(group, state.scores[group]); }
  else sfx.none();
  save();
  boardView();
  var cell = $('cell' + key);
  cell.classList.remove('used'); cell.classList.add('erasing');
  setTimeout(function () { cell.classList.remove('erasing'); cell.classList.add('used'); }, 420);
  if (Object.keys(state.used).length === 25) setTimeout(endGame, 900);
}

function endGame() {
  stopSpeech();
  var max = Math.max.apply(null, state.scores);
  var winners = state.names.filter(function (n, i) { return state.scores[i] === max; });
  $('winner').textContent = max === 0 ? 'No points yet'
    : winners.length > 1 ? 'Tie: ' + winners.join(' and ') : winners[0] + ' wins';
  var f = $('finalScores'); f.innerHTML = '';
  state.names
    .map(function (n, i) { return { n: n, s: state.scores[i], i: i }; })
    .sort(function (a, b) { return b.s - a.s; })
    .forEach(function (x) {
      var d = document.createElement('div'); d.className = 't' + x.i;
      d.textContent = x.n + ': ' + x.s; f.appendChild(d);
    });
  show('endScreen'); sfx.end();
  var btns = [];
  if (Object.keys(state.used).length < 25) btns.push({ text: 'Back to board', fn: boardView });
  btns.push({ text: 'New game', cls: 'primary', fn: newGame });
  rack(btns);
}

function setupRack() { rack([]); }

/* ---------- Init ---------- */
(function init() {
  var saved = load();
  if (saved && saved.names && saved.used) {
    $('continueBtn').hidden = false;
    for (var i = 0; i < 3; i++) $('n' + i).value = saved.names[i];
  }
  $('startBtn').onclick = startGame;
  $('continueBtn').onclick = continueGame;
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  renderScores(); setupRack();
})();
</script>
</body>
</html>
